name: Isolated MQTT reconnect smoke

on:
  pull_request:
    paths:
      - ".github/workflows/mqtt-reconnect-smoke.yml"
      - "backend/tools/mqtt_reconnect_smoke.cpp"
      - "backend/src/mqtt/**"
      - "scripts/test_mqtt_reconnect_linux.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mqtt-reconnect-smoke:
    name: MQTT broker restart (no real database)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install isolated MQTT test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpaho-mqttpp-dev libpaho-mqtt-dev \
            nlohmann-json3-dev mosquitto mosquitto-clients

      - name: Run restart smoke test
        run: bash scripts/test_mqtt_reconnect_linux.sh
