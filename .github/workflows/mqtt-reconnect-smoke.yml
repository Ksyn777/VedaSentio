name: Isolated MQTT reconnect smoke

on:
  pull_request:
    paths:
      - ".github/workflows/mqtt-reconnect-smoke.yml"
      - "backend/tools/mqtt_reconnect_smoke.cpp"
      - "backend/tools/mqtt_postgres_offline_test.cpp"
      - "scripts/test_mqtt_postgres_offline_linux.sh"
      - "database/**"
      - "backend/src/mqtt/**"
      - "scripts/test_mqtt_reconnect_linux.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mqtt-reconnect-smoke:
    name: MQTT broker restart (no real database)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install isolated MQTT test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpaho-mqttpp-dev libpaho-mqtt-dev \
            nlohmann-json3-dev mosquitto mosquitto-clients

      - name: Run restart smoke test
        run: bash scripts/test_mqtt_reconnect_linux.sh

  mqtt-postgres-offline:
    name: PostgreSQL + MQTT offline alarm recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VEDASENTIO_DB_HOST: "127.0.0.1"
      VEDASENTIO_DB_PORT: "5432"
      VEDASENTIO_DB_NAME: "vedasentio_mqtt_ci"
      VEDASENTIO_DB_USER: "ci_test"
      VEDASENTIO_DB_PASSWORD: "ci_disposable_only"
      VEDASENTIO_SMOKE_PORT: "28884"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vedasentio_mqtt_ci
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d vedasentio_mqtt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install disposable PostgreSQL and MQTT test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ cmake libpq-dev postgresql-client \
            nlohmann-json3-dev libpaho-mqttpp-dev libpaho-mqtt-dev \
            mosquitto mosquitto-clients

      - name: Build pinned, patched libpqxx 7.10.7
        run: |
          git clone --depth 1 --branch 7.10.7 \
            https://github.com/jtv/libpqxx.git "$RUNNER_TEMP/libpqxx"
          test "$(git -C "$RUNNER_TEMP/libpqxx" rev-parse HEAD)" = \
            "853bc0a48f0327d8670c1c0855f7abf731046319"
          cmake -S "$RUNNER_TEMP/libpqxx" -B "$RUNNER_TEMP/libpqxx/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSKIP_BUILD_TEST=ON
          cmake --build "$RUNNER_TEMP/libpqxx/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/libpqxx/build"
          sudo ldconfig

      - name: Check PostgreSQL + offline alarm + broker restart
        run: bash scripts/test_mqtt_postgres_offline_linux.sh
