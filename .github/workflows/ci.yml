name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend C++
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          Push-Location $vcpkg
          git checkout 4cb050be2cfa7a947cdd2dd1a70e24b17774c979
          .\bootstrap-vcpkg.bat -disableMetrics
          Pop-Location
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure backend
        shell: pwsh
        run: cmake -S backend -B backend/build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build backend
        shell: pwsh
        run: cmake --build backend/build --config Release --parallel 2

      - name: Run backend tests
        shell: pwsh
        run: |
          $dataKey = [Convert]::ToBase64String([byte[]]::new(32))
          $lookupBytes = [byte[]]::new(32)
          for ($i = 0; $i -lt $lookupBytes.Length; $i++) {
            $lookupBytes[$i] = 1
          }

          $env:VEDASENTIO_DATA_ENCRYPTION_KEY_B64 = $dataKey
          $env:VEDASENTIO_LOOKUP_HMAC_KEY_B64 = [Convert]::ToBase64String($lookupBytes)

          & ".\backend\build\Release\vedasentio_crypto_test.exe"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          ctest --test-dir backend/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Prepare example firmware configuration
        shell: bash
        run: |
          cp firmware/door_contact_esp32/include/secrets.example.h firmware/door_contact_esp32/include/secrets.h

      - name: Build firmware
        run: pio run -d firmware/door_contact_esp32
